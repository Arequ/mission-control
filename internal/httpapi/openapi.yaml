openapi: 3.0.3
info:
  title: Mission Control API
  version: 0.1.0
  description: |
    Versioned HTTP API for Mission Control. Configuration resources are written
    by the Terraform provider and shown read-only in the UI. Config POST, PUT,
    and DELETE require the header X-Mission-Control-Client: terraform in
    addition to a token with config:write. Runners call the lease, log,
    artifact, and complete endpoints with a runner token and the lease attempt.
    Munki clients fetch catalogs, manifests, and packages under /repo.
    osqueryd uses the TLS remote API at /enroll, /config, /logger,
    /distributed_read, and /distributed_write. Those routes authenticate with
    an enroll secret or a node key, not an API token.
    Job, audit, device, and result lists accept limit (default 100, max 500)
    and offset, and return total.
    Scopes include osquery:read and osquery:write. Live queries and node
    invalidation are operational and do not require the Terraform client header.
    Coverage reads use osquery:read. Vulnerability reads use vuln:read and
    vulnerability updates use vuln:write. Log view runs use logs:read. Source connectors are configuration:
    writes require config:write and the Terraform client header. Connector
    credentials are write-only and are never returned. The NVD API key on
    vulnerability settings is write-only and is never returned. An empty key
    on update keeps the stored key. Promotion of a vulnerable package is a
    pull request against the configured GitOps repository
    (MC_CONFIG_REPO, default Arequ/terraform-mission-control), not an API call.
    GET /api/v1/meta returns that repository, its default branch, and a deep
    link for each config kind.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: config
  - name: jobs
  - name: runners
  - name: munki
  - name: osquery
  - name: vuln
  - name: meta
paths:
  /healthz:
    get:
      tags: [meta]
      security: []
      summary: Liveness
      responses:
        "200": { description: ok }
  /readyz:
    get:
      tags: [meta]
      security: []
      summary: Readiness (database ping)
      responses:
        "200": { description: ready }
        "503": { description: database unavailable }
  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: This document
      responses:
        "200": { description: OpenAPI YAML }
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: This document
      responses:
        "200": { description: OpenAPI YAML }
  /api/v1/meta:
    get:
      tags: [meta]
      security: []
      summary: Public UI settings for the GitOps repository. No credentials.
      description: |
        config_repo and config_branch come from MC_CONFIG_REPO and
        MC_CONFIG_BRANCH. config_links maps each config kind to a GitHub edit
        URL, or a tree URL when that kind has no single file.
      responses:
        "200":
          description: settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerMeta" }
  /api/v1/tokens:
    get:
      tags: [meta]
      summary: List API tokens. The secret is not returned.
      responses:
        "200": { description: list }
        "401": { description: unauthorized }
        "403": { description: missing admin scope }
    post:
      tags: [meta]
      summary: Create an API token. The secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { type: string }
      responses:
        "201": { description: created }
        "400": { description: invalid body }
        "401": { description: unauthorized }
        "403": { description: missing admin scope }
  /api/v1/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      tags: [meta]
      summary: Delete an API token
      responses:
        "204": { description: deleted }
        "401": { description: unauthorized }
        "403": { description: missing admin scope }
        "404": { description: not found }
  /api/v1/recipe-repos:
    get:
      tags: [config]
      summary: List recipe repositories
      responses:
        "200": { description: list }
    post:
      tags: [config]
      summary: Create a recipe repository
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeRepoWrite" }
      responses:
        "201": { description: created }
  /api/v1/recipe-repos/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [config]
      summary: Get a recipe repository
      responses:
        "200": { description: repo }
    put:
      tags: [config]
      summary: Replace a recipe repository
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeRepoWrite" }
      responses:
        "200": { description: updated }
    delete:
      tags: [config]
      summary: Delete a recipe repository
      responses:
        "204": { description: deleted }
  /api/v1/recipes:
    get:
      tags: [config]
      summary: List recipes and their latest run
      responses:
        "200": { description: list }
    post:
      tags: [config]
      summary: Create a recipe override
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeWrite" }
      responses:
        "201": { description: created }
  /api/v1/recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [config]
      summary: Get a recipe
      responses:
        "200": { description: recipe }
    put:
      tags: [config]
      summary: Replace a recipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeWrite" }
      responses:
        "200": { description: updated }
    delete:
      tags: [config]
      summary: Delete a recipe
      responses:
        "204": { description: deleted }
  /api/v1/schedules:
    get:
      tags: [config]
      summary: List schedules
      responses:
        "200": { description: list }
    post:
      tags: [config]
      summary: Create a schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleWrite" }
      responses:
        "201": { description: created }
  /api/v1/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [config]
      summary: Get a schedule
      responses:
        "200": { description: schedule }
    put:
      tags: [config]
      summary: Replace a schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleWrite" }
      responses:
        "200": { description: updated }
    delete:
      tags: [config]
      summary: Delete a schedule
      responses:
        "204": { description: deleted }
  /api/v1/pipeline-settings:
    get:
      tags: [config]
      summary: Get fleet pipeline settings
      responses:
        "200": { description: settings }
    put:
      tags: [config]
      summary: Replace fleet pipeline settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineSettings" }
      responses:
        "200": { description: updated }
    delete:
      tags: [config]
      summary: Reset pipeline settings to defaults
      responses:
        "200": { description: defaults }
  /api/v1/promotion-rules:
    get:
      tags: [config]
      summary: List promotion rules
      responses:
        "200": { description: list }
    post:
      tags: [config]
      summary: Create a promotion rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionRuleWrite" }
      responses:
        "201": { description: created }
  /api/v1/promotion-rules/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [config]
      summary: Get a promotion rule
      responses:
        "200": { description: rule }
    put:
      tags: [config]
      summary: Replace a promotion rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionRuleWrite" }
      responses:
        "200": { description: updated }
    delete:
      tags: [config]
      summary: Delete a promotion rule
      responses:
        "204": { description: deleted }
  /api/v1/runner-pools:
    get:
      tags: [config]
      summary: List runner pools
      responses:
        "200": { description: list }
    post:
      tags: [config]
      summary: Create a runner pool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunnerPoolWrite" }
      responses:
        "201": { description: created }
  /api/v1/runner-pools/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [config]
      summary: Get a runner pool
      responses:
        "200": { description: pool }
    put:
      tags: [config]
      summary: Replace a runner pool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunnerPoolWrite" }
      responses:
        "200": { description: updated }
    delete:
      tags: [config]
      summary: Delete a runner pool
      responses:
        "204": { description: deleted }
  /api/v1/manifests:
    get:
      tags: [config]
      summary: List Munki manifests
      responses:
        "200": { description: list }
    post:
      tags: [config]
      summary: Create a manifest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManifestWrite" }
      responses:
        "201": { description: created }
  /api/v1/manifests/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [config]
      summary: Get a manifest
      responses:
        "200": { description: manifest }
    put:
      tags: [config]
      summary: Replace a manifest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManifestWrite" }
      responses:
        "200": { description: updated }
    delete:
      tags: [config]
      summary: Delete a manifest
      responses:
        "204": { description: deleted }
  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: List runs
      parameters:
        - in: query
          name: recipe_id
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: jobs, limit, offset, and total
    post:
      tags: [jobs]
      summary: Run a recipe now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe_id]
              properties:
                recipe_id: { type: string }
      responses:
        "201": { description: queued job }
  /api/v1/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [jobs]
      summary: Get a run, including logs
      responses:
        "200": { description: job }
  /api/v1/runners:
    get:
      tags: [runners]
      summary: List registered runners
      responses:
        "200": { description: list }
  /api/v1/runners/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      tags: [runners]
      summary: Delete a runner
      responses:
        "204": { description: deleted }
  /api/v1/runners/register:
    post:
      tags: [runners]
      summary: Register a runner with a bootstrap token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                labels:
                  type: array
                  items: { type: string }
                pool: { type: string, description: Pool name }
                hostname: { type: string }
                os_version: { type: string }
                autopkg_version: { type: string }
      responses:
        "201":
          description: Runner plus a one-time runner token
  /api/v1/runners/heartbeat:
    post:
      tags: [runners]
      summary: Runner heartbeat
      responses:
        "200": { description: ok }
  /api/v1/runners/lease:
    post:
      tags: [runners]
      summary: Long-poll for a job lease
      parameters:
        - in: query
          name: wait
          schema: { type: string, enum: ["0"] }
          description: Set to 0 to return immediately
        - in: query
          name: wait_seconds
          schema: { type: integer, maximum: 60 }
      responses:
        "200": { description: a lease }
        "204": { description: nothing queued }
  /api/v1/jobs/{id}/logs:
    post:
      tags: [runners]
      summary: Append log lines for the current lease attempt
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt, lines]
              properties:
                attempt: { type: integer, minimum: 1 }
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      stream: { type: string, enum: [stdout, stderr] }
                      line: { type: string }
      responses:
        "200": { description: stored }
        "400": { description: attempt missing }
        "403": { description: attempt does not match the current lease }
  /api/v1/jobs/{id}/renew:
    post:
      tags: [runners]
      summary: Extend a lease that has not expired
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt]
              properties:
                attempt: { type: integer, minimum: 1 }
      responses:
        "200": { description: new expiry }
        "403": { description: lease expired or attempt does not match }
  /api/v1/jobs/{id}/artifacts:
    post:
      tags: [runners]
      summary: Upload pkginfo and a package
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [attempt, pkginfo, package]
              properties:
                attempt: { type: integer, minimum: 1 }
                pkginfo: { type: string, format: binary }
                package: { type: string, format: binary }
      responses:
        "200": { description: imported or already present }
        "400": { description: invalid filename or missing attempt }
        "409": { description: name and version already exist with different bytes }
        "413": { description: upload exceeds the size limit }
  /api/v1/jobs/{id}/complete:
    post:
      tags: [runners]
      summary: Finish a job
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt, result]
              properties:
                attempt: { type: integer, minimum: 1 }
                result:
                  type: string
                  enum: [no_change, new_version, trust_failed, error]
                error: { type: string }
      responses:
        "200": { description: job }
        "400": { description: attempt missing or result invalid }
        "403": { description: attempt does not match the current lease }
  /api/v1/catalogs:
    get:
      tags: [munki]
      summary: List generated catalogs
      responses:
        "200": { description: list }
  /api/v1/packages:
    get:
      tags: [munki]
      summary: List packages
      parameters:
        - in: query
          name: catalog
          schema: { type: string }
      responses:
        "200": { description: list }
  /api/v1/packages/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [munki]
      summary: Get a package
      responses:
        "200": { description: package }
  /api/v1/packages/{id}/promote:
    post:
      tags: [munki]
      summary: Manually promote a package to the next catalog
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: promoted package }
  /api/v1/promotions/run:
    post:
      tags: [munki]
      summary: Run the promotion pass now
      responses:
        "200": { description: count promoted }
  /api/v1/audit:
    get:
      tags: [meta]
      summary: Audit entries, newest first
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: audit, limit, offset, and total
  /repo/catalogs/{name}:
    get:
      tags: [munki]
      summary: Munki catalog plist
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200": { description: XML plist catalog }
  /repo/manifests/{name}:
    get:
      tags: [munki]
      summary: Munki manifest plist
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200": { description: XML plist manifest }
  /repo/pkgs/{path}:
    get:
      tags: [munki]
      summary: Package bytes
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: package }
  /api/v1/osquery/queries:
    get:
      tags: [osquery]
      summary: List Terraform-managed osquery queries
      responses:
        "200": { description: list }
    post:
      tags: [osquery]
      summary: Create a query. Requires the Terraform client header.
      responses:
        "201": { description: created }
        "400": { description: invalid }
        "403": { description: not the Terraform client }
  /api/v1/osquery/queries/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [osquery]
      summary: Get a query
      responses:
        "200": { description: query }
        "404": { description: not found }
    put:
      tags: [osquery]
      summary: Update a query. Requires the Terraform client header.
      responses:
        "200": { description: updated }
    delete:
      tags: [osquery]
      summary: Delete a query. Requires the Terraform client header.
      responses:
        "204": { description: deleted }
  /api/v1/osquery/packs:
    get:
      tags: [osquery]
      summary: List query packs
      responses:
        "200": { description: list }
    post:
      tags: [osquery]
      summary: Create a pack. Requires the Terraform client header.
      responses:
        "201": { description: created }
  /api/v1/osquery/packs/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [osquery]
      summary: Get a pack
      responses:
        "200": { description: pack }
    put:
      tags: [osquery]
      summary: Update a pack. Requires the Terraform client header.
      responses:
        "200": { description: updated }
    delete:
      tags: [osquery]
      summary: Delete a pack. Requires the Terraform client header.
      responses:
        "204": { description: deleted }
  /api/v1/osquery/labels:
    get:
      tags: [osquery]
      summary: List dynamic and manual labels
      responses:
        "200": { description: list }
    post:
      tags: [osquery]
      summary: Create a label. Requires the Terraform client header.
      responses:
        "201": { description: created }
  /api/v1/osquery/labels/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [osquery]
      summary: Get a label
      responses:
        "200": { description: label }
    put:
      tags: [osquery]
      summary: Update a label. Requires the Terraform client header.
      responses:
        "200": { description: updated }
    delete:
      tags: [osquery]
      summary: Delete a label. Requires the Terraform client header.
      responses:
        "204": { description: deleted }
  /api/v1/osquery/enroll-secrets:
    get:
      tags: [osquery]
      summary: List enroll secrets. The secret value is never returned.
      responses:
        "200": { description: list }
    post:
      tags: [osquery]
      summary: Create an enroll secret. Requires the Terraform client header.
      responses:
        "201": { description: created }
  /api/v1/log-views:
    get:
      tags: [config]
      summary: List log views. Credentials are never returned. name is an optional exact match.
      parameters:
        - { name: name, in: query, schema: { type: string } }
      responses:
        "200": { description: list }
    post:
      tags: [config]
      summary: Create a log view. Requires the Terraform client header. elastic_api_key is write-only.
      responses:
        "201": { description: created }
  /api/v1/log-views/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [config]
      summary: Get a log view. Credentials are never returned.
      responses:
        "200": { description: log view }
        "404": { description: not found }
    put:
      tags: [config]
      summary: Update a log view. Requires the Terraform client header. An empty elastic_api_key keeps the stored value.
      responses:
        "200": { description: updated }
    delete:
      tags: [config]
      summary: Delete a log view. Requires the Terraform client header.
      responses:
        "204": { description: deleted }
  /api/v1/log-views/{id}/query:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [config]
      summary: Run a log view for a time window. Requires logs:read. Lines are merged by timestamp, source, then sequence.
      responses:
        "200": { description: page }
  /api/v1/log-views/{id}/tail:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [config]
      summary: Poll lines strictly after a cursor. Requires logs:read.
      responses:
        "200": { description: page }
  /api/v1/log-views/{id}/context:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [config]
      summary: Lines before and after one line, across every source in the view. Requires logs:read.
      responses:
        "200": { description: context }
        "404": { description: not found }
  /api/v1/source-connectors:
    get:
      tags: [config]
      summary: List source connectors. Credentials are never returned.
      responses:
        "200": { description: list }
    post:
      tags: [config]
      summary: Create a source connector. Requires the Terraform client header. Credentials are write-only.
      responses:
        "201": { description: created }
  /api/v1/source-connectors/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [config]
      summary: Get a source connector. Credentials are never returned.
      responses:
        "200": { description: connector }
    put:
      tags: [config]
      summary: Update a source connector. Requires the Terraform client header. An empty credential keeps the stored value.
      responses:
        "200": { description: updated }
    delete:
      tags: [config]
      summary: Delete a source connector. Requires the Terraform client header.
      responses:
        "204": { description: deleted }
  /api/v1/coverage/matrix:
    get:
      tags: [osquery]
      summary: Coverage matrix. filter is all, gaps, missing, single, ghost, or stale. source names the missing tool. stale_days defaults to 7.
      parameters:
        - { name: filter, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: stale_days, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: matrix }
  /api/v1/coverage/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [osquery]
      summary: Per-device coverage pane, including ghosts addressed by their coverage id.
      responses:
        "200": { description: coverage }
        "404": { description: not found }
  /api/v1/coverage/connectors:
    get:
      tags: [osquery]
      summary: Connector health. Credentials are not included.
      responses:
        "200": { description: health }
  /api/v1/osquery/enroll-secrets/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [osquery]
      summary: Get an enroll secret record
      responses:
        "200": { description: secret metadata }
    put:
      tags: [osquery]
      summary: Rotate or disable an enroll secret. Requires the Terraform client header.
      responses:
        "200": { description: updated }
    delete:
      tags: [osquery]
      summary: Delete an enroll secret. Requires the Terraform client header.
      responses:
        "204": { description: deleted }
  /api/v1/fleet/summary:
    get:
      tags: [osquery]
      summary: Fleet KPIs, macOS version distribution, and AutoPKG status
      responses:
        "200": { description: summary }
  /api/v1/devices:
    get:
      tags: [osquery]
      summary: List devices
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: platform, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [online, offline] } }
        - { in: query, name: label, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer } }
        - { in: query, name: offset, schema: { type: integer } }
      responses:
        "200": { description: page }
  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [osquery]
      summary: Device detail, installed apps, labels, and recent change events
      responses:
        "200": { description: device }
        "404": { description: not found }
  /api/v1/devices/{id}/results:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [osquery]
      summary: Paginated raw result logs for a device
      parameters:
        - { in: query, name: query, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer } }
        - { in: query, name: offset, schema: { type: integer } }
      responses:
        "200": { description: page }
  /api/v1/devices/{id}/invalidate:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [osquery]
      summary: Invalidate the node key so osquery re-enrolls. Requires osquery:write.
      responses:
        "200": { description: device }
  /api/v1/live-queries:
    post:
      tags: [osquery]
      summary: Run SQL on devices or labels through osquery distributed queries. Requires osquery:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql: { type: string }
                device_ids: { type: array, items: { type: string } }
                labels: { type: array, items: { type: string } }
                timeout_seconds: { type: integer }
      responses:
        "201": { description: live query }
        "400": { description: invalid sql or empty target }
  /api/v1/live-queries/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [osquery]
      summary: Live query status and rows received so far
      responses:
        "200": { description: live query }
  /enroll:
    post:
      tags: [osquery]
      security: []
      summary: osquery TLS enroll. Matches an existing device by hardware UUID, then serial.
      responses:
        "200": { description: node_key }
        "401": { description: enroll secret rejected }
  /config:
    post:
      tags: [osquery]
      security: []
      summary: osquery TLS config. Includes inventory queries, label queries, and packs the node is in.
      responses:
        "200": { description: config or node_invalid }
  /logger:
    post:
      tags: [osquery]
      security: []
      summary: osquery TLS logger for status and result logs
      responses:
        "200": { description: accepted or node_invalid }
  /distributed_read:
    post:
      tags: [osquery]
      security: []
      summary: osquery distributed read. Returns pending live queries for the node.
      responses:
        "200": { description: queries or node_invalid }
  /distributed_write:
    post:
      tags: [osquery]
      security: []
      summary: osquery distributed write. Stores live query results.
      responses:
        "200": { description: accepted or node_invalid }
  /api/v1/vulnerability-settings:
    get:
      tags: [config]
      summary: Read vulnerability feed settings. The NVD API key is not returned.
      responses:
        "200": { description: settings }
    put:
      tags: [config]
      summary: Replace vulnerability settings. Requires the Terraform client header. An empty nvd_api_key keeps the stored key.
      responses:
        "200": { description: settings }
    delete:
      tags: [config]
      summary: Reset vulnerability settings and drop the NVD API key. Requires the Terraform client header.
      responses:
        "200": { description: defaults }
  /api/v1/vulnerability-issues:
    get:
      tags: [vuln]
      summary: List vulnerability issues, prioritized by KEV, EPSS, CVSS, then device count.
      parameters:
        - { name: kev, in: query, schema: { type: boolean } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: has_fix, in: query, schema: { type: boolean } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: issues and summary }
  /api/v1/vulnerability-issues/{id}:
    get:
      tags: [vuln]
      summary: One issue, affected devices, fix path, and timeline.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: issue }
    post:
      tags: [vuln]
      summary: Update status, assignee, or notes. Requires the current revision. Risk acceptance needs an expiry.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: issue }
        "409": { description: stale revision }
  /api/v1/vulnerability-issues/{id}/notes:
    post:
      tags: [vuln]
      summary: Add a note to the issue timeline.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: issue }
  /api/v1/vulnerability-issues/{id}/run-recipe:
    post:
      tags: [vuln]
      summary: Enqueue the AutoPKG recipe linked to this issue. Does not promote a catalog.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: job }
  /api/v1/vulnerabilities/sync:
    post:
      tags: [vuln]
      summary: Run one feed sync now. No-ops the network when feeds are not configured on the server.
      responses:
        "200": { description: settings }
  /api/v1/devices/{id}/vulnerabilities:
    get:
      tags: [vuln]
      summary: Active vulnerability issues for one device.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: issues }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
      description: Password is the repo token or an API token with munki:read.
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    RecipeRepoWrite:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
        ref: { type: string, default: main }
        managed_by: { type: string, example: terraform }
    RecipeWrite:
      type: object
      required: [identifier, name]
      properties:
        identifier: { type: string }
        name: { type: string }
        repo_id: { type: string, nullable: true }
        enabled: { type: boolean, default: true }
        override: { type: string }
        trust_info: { type: object, additionalProperties: true }
        runner_pool_id: { type: string, nullable: true }
        labels:
          type: array
          items: { type: string }
        managed_by: { type: string }
    ScheduleWrite:
      type: object
      required: [name, recipe_id, cron]
      properties:
        name: { type: string }
        recipe_id: { type: string }
        cron: { type: string, description: Five-field cron, minute hour dom month dow }
        timezone: { type: string, default: UTC, description: IANA timezone. Blank means UTC. }
        enabled: { type: boolean, default: true }
        managed_by: { type: string }
    PipelineSettings:
      type: object
      required: [max_concurrency, per_runner_parallelism, timeout_seconds, max_retries, lease_seconds]
      properties:
        max_concurrency: { type: integer, minimum: 1 }
        per_runner_parallelism: { type: integer, minimum: 1 }
        timeout_seconds: { type: integer, minimum: 1 }
        max_retries: { type: integer, minimum: 0 }
        lease_seconds: { type: integer, minimum: 5 }
        managed_by: { type: string }
    PromotionRuleWrite:
      type: object
      required: [name, from_catalog, to_catalog]
      properties:
        name: { type: string }
        from_catalog: { type: string }
        to_catalog: { type: string }
        soak_days: { type: integer, minimum: 0 }
        manual_hold: { type: boolean }
        enabled: { type: boolean, default: true }
        managed_by: { type: string }
    RunnerPoolWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
        managed_by: { type: string }
    ManifestWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        catalogs:
          type: array
          items: { type: string }
        included_manifests:
          type: array
          items: { type: string }
        managed_installs:
          type: array
          items: { type: string }
        optional_installs:
          type: array
          items: { type: string }
        managed_uninstalls:
          type: array
          items: { type: string }
        managed_by: { type: string }
    ServerMeta:
      type: object
      required: [config_repo, config_branch, config_links]
      properties:
        config_repo: { type: string, example: Arequ/terraform-mission-control }
        config_branch: { type: string, example: main }
        config_links:
          type: object
          additionalProperties: { type: string, format: uri }
          description: |
            GitHub edit URL (`/edit/<branch>/<path>`) or tree URL
            (`/tree/<branch>/<dir>`) for each config kind.
          properties:
            recipe: { type: string }
            schedule: { type: string }
            runner_pool: { type: string }
            munki_catalog: { type: string }
            munki_manifest: { type: string }
            munki_promotion: { type: string }
            os_policy: { type: string }
            osquery_pack: { type: string }
            osquery_query: { type: string }
            osquery_label: { type: string }
            source_connector: { type: string }
            log_view: { type: string }
            vulnerability_settings: { type: string }
            cpe_override: { type: string }
            sla: { type: string }
