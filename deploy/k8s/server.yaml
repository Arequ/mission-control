apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control
  labels:
    app: mission-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mission-control
  template:
    metadata:
      labels:
        app: mission-control
    spec:
      containers:
        - name: server
          image: mission-control:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mission-control
                  key: database-url
            - name: MC_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mission-control
                  key: admin-token
            - name: MC_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mission-control
                  key: bootstrap-token
            - name: MC_REPO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mission-control
                  key: repo-token
            - name: MC_STORAGE_DRIVER
              value: s3
            - name: MC_S3_ENDPOINT
              value: s3.example.internal:9000
            - name: MC_S3_BUCKET
              value: mission-control
            - name: MC_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mission-control
                  key: s3-access-key
            - name: MC_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mission-control
                  key: s3-secret-key
            - name: MC_HTTP_ADDR
              value: :8080
            - name: MC_DEV_SEED
              value: "0"
            - name: MC_COOKIE_SECURE
              value: "1"
            - name: MC_PUBLIC_URL
              value: https://mc.example
            - name: MC_CONFIG_REPO
              value: Arequ/terraform-mission-control
            - name: MC_BREAK_GLASS
              value: "0"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mission-control
spec:
  selector:
    app: mission-control
  ports:
    - name: http
      port: 80
      targetPort: http
