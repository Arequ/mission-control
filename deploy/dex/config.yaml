# Local Dex for docker compose. The client secret and password are the same
# class of placeholder as mc_dev_admin_token. Do not reuse them outside this stack.
issuer: http://dex:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: mission-control
    redirectURIs:
      - "http://localhost:8080/api/v1/sso/callback"
    name: Mission Control
    secret: example-oidc-client-secret

enablePasswordDB: true

staticPasswords:
  - email: "ava@example.com"
    # bcrypt of example-oidc-password
    hash: "$2a$10$Qp4x2cToStg0JZd8TumTee6xGAvBpmRKE/AbqaDbuPLCXO8R31ubO"
    username: "ava"
    userID: "ava-thompson"
